/* =====================================================================
   DESIGN LAB · COMPONENTS
   Every visual value comes from the theme's token block (var(--…)).
   Nothing here names a colour, font, radius or shadow directly, so a
   tool changes theme by swapping the token block + effects module.
   Runtime-only variables: --i, --n (indicator position), --p (progress),
   --sat/--sab (safe areas).
   ===================================================================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg);color-scheme:var(--color-scheme);-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:96px}
body{color:var(--text);font:var(--fs-body)/1.5 var(--font-ui);letter-spacing:var(--ls-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
input,select,textarea{-webkit-appearance:none;appearance:none}
[hidden]{display:none!important}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
::selection{background:var(--selection)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--font-num-table);font-variant-numeric:tabular-nums lining-nums;letter-spacing:var(--ls-num)}
.muted{color:var(--text-3)}
.neg{color:var(--danger)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------------------------------------------------------- background */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg-image)}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

/* ---------------------------------------------------------------- shell */
.app{position:relative;z-index:1;min-height:100vh}
.wrap{max-width:var(--page-max);margin:0 auto;padding:0 calc(var(--page-pad) + var(--sar)) 0 calc(var(--page-pad) + var(--sal))}
main.wrap{padding-bottom:96px}

.app-header{position:sticky;top:0;z-index:40;padding:calc(10px + var(--sat)) 0 10px}
.app-header::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--header-bg);border-bottom:var(--bw) solid var(--header-border);
  -webkit-backdrop-filter:var(--header-blur);backdrop-filter:var(--header-blur)}
.app-header .wrap{display:flex;align-items:center;gap:16px;min-height:48px}
.app-id{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 0}
.app-icon{width:38px;height:38px;flex:none;border-radius:var(--r-icon);overflow:hidden;box-shadow:var(--shadow-icon)}
.app-icon svg{display:block;width:100%;height:100%}
.app-title{min-width:0}
.app-title b{display:block;font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-apptitle);letter-spacing:var(--ls-display);line-height:1.1;white-space:nowrap}
.app-title small{display:block;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:1 1 0}

/* tabs: equal-width cells, so the indicator only ever moves with translateX */
.tabs{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:var(--tabs-pad);border-radius:var(--r-tabs);
  background:var(--tabs-bg);border:var(--bw) solid var(--tabs-border);box-shadow:var(--tabs-shadow);-webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop)}
.tab{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border-radius:var(--r-tab);
  color:var(--tab-text);font-size:13.5px;font-weight:var(--fw-tab);letter-spacing:var(--ls-tab);text-transform:var(--tab-case);white-space:nowrap;transition:color var(--dur) var(--ease)}
.tab:hover{color:var(--text)}
.tab svg{flex:none;transition:transform var(--dur-slow) var(--ease-spring)}
.tab.is-active{color:var(--tab-active-text)}
.tabs__indicator{position:absolute;z-index:0;top:var(--tabs-pad);bottom:var(--tabs-pad);left:var(--tabs-pad);width:calc((100% - 2 * var(--tabs-pad)) / var(--n,4));
  transform:translateX(calc(var(--i,0) * 100%));transition:transform var(--dur-slow) var(--ease-spring);pointer-events:none}
.tabs__indicator i{position:absolute;inset:0;border-radius:var(--r-tab);background:var(--tab-active-bg);box-shadow:var(--tab-active-shadow);transition:transform var(--dur-slow) var(--ease-spring)}

/* ---------------------------------------------------------------- sections */
.section{margin-top:var(--section-gap);scroll-margin-top:96px}
.section:first-child{margin-top:var(--first-gap)}
.section__head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:var(--head-gap)}
.eyebrow{display:block;font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--eyebrow)}
.section__title{font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-h2);letter-spacing:var(--ls-display);line-height:var(--lh-display);margin:6px 0 0}
.section__lead{color:var(--text-2);max-width:62ch;margin:10px 0 0;font-size:var(--fs-lead)}
.note{font-size:12.5px;color:var(--text-3);line-height:1.55}

.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(12,minmax(0,1fr))}
.grid > *{grid-column:span 12;min-width:0}
@media (min-width:900px){
  .s3{grid-column:span 3} .s4{grid-column:span 4} .s5{grid-column:span 5} .s6{grid-column:span 6} .s7{grid-column:span 7} .s8{grid-column:span 8}
}

/* ---------------------------------------------------------------- cards */
.card{position:relative;background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-card);
  -webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);padding:var(--pad-card);min-width:0}
.card__head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:var(--card-head-gap)}
.card__title{margin:0;font-family:var(--font-card-title);font-size:var(--fs-card-title);font-weight:var(--fw-card-title);letter-spacing:var(--ls-card-title);line-height:1.25}
.card__sub{margin:3px 0 0;color:var(--text-3);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row + .row{margin-top:14px}
.row-label{width:100%;font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--text-3);margin-bottom:-2px}

/* tags: signature vs optional extra */
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--r-chip);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tag--sig{background:var(--accent-soft);color:var(--accent-text)}
.tag--extra{background:var(--neutral-soft);color:var(--text-2)}
.tag--opt{background:transparent;color:var(--text-3);box-shadow:inset 0 0 0 var(--bw) var(--border-strong)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-chip);font-size:12px;font-weight:600;background:var(--neutral-soft);color:var(--text-2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;flex:none}
.chip--filter{height:34px;padding:0 14px;font-size:13px;border:var(--bw) solid var(--border);background:var(--field-bg);transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur) var(--ease-spring)}
.chip--filter:active{transform:scale(var(--press))}
.chip--filter.is-on{background:var(--chip-on-bg);color:var(--chip-on-text);border-color:transparent}

/* ---------------------------------------------------------------- buttons */
.btn{--h:var(--btn-h);position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 var(--btn-pad);
  border-radius:var(--r-btn);border:var(--bw) solid transparent;font-size:var(--fs-btn);font-weight:var(--fw-btn);letter-spacing:var(--ls-btn);text-transform:var(--btn-case);white-space:nowrap;
  transition:transform var(--dur) var(--ease-spring),opacity var(--dur-fast)}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--btn-hover-overlay);opacity:0;transition:opacity var(--dur-fast)}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(var(--press))}
.btn svg{flex:none}
.btn--primary{background:var(--primary-bg);color:var(--primary-text);box-shadow:var(--primary-shadow)}
.btn--secondary{background:var(--secondary-bg);color:var(--secondary-text);border-color:var(--secondary-border)}
.btn--ghost{background:transparent;color:var(--text-2);border-color:var(--border)}
.btn--ghost:hover{color:var(--text)}
.btn--danger{background:var(--danger-bg);color:var(--danger-on);box-shadow:var(--danger-shadow)}
.btn--quiet-danger{background:transparent;color:var(--danger);border-color:var(--danger-line)}
.btn--sm{--h:var(--btn-h-sm);padding:0 calc(var(--btn-pad) - 5px);font-size:13px}
.btn--icon{width:var(--h);padding:0}
.btn--block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.is-loading{pointer-events:none}
.btn.is-loading .btn__label,.btn.is-loading svg{opacity:0}
.btn.is-loading::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}

/* save button: quiet when saved, amber and blinking while there are unsaved changes */
.save{overflow:visible}
.save.is-dirty{background:var(--warning);color:var(--warning-on);border-color:transparent;box-shadow:none}
.save.is-dirty::after{display:none}
.save.is-dirty::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--warning-deep);animation:blink 1.6s ease-in-out infinite}
.save .ring{position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 4px var(--warning-glow);opacity:0}
.save.is-dirty .ring{animation:ring 1.6s ease-out infinite}
@keyframes blink{50%{opacity:1}0%,100%{opacity:0}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.16)}}
.save .dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none}
.save.is-dirty .dot{background:currentColor}

/* ---------------------------------------------------------------- KPI cards */
.kpis{display:grid;gap:var(--gap);grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:var(--kpi-h)}
.kpi__label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--kpi-label);font-size:var(--kpi-label-size);font-weight:var(--kpi-label-weight);
  letter-spacing:var(--kpi-label-spacing);text-transform:var(--kpi-label-case)}
.kpi__value{font-family:var(--font-num);font-size:var(--fs-kpi);font-weight:var(--fw-num);letter-spacing:var(--ls-kpi);line-height:1;white-space:nowrap;
  font-variant-numeric:tabular-nums lining-nums;margin-top:10px}
.kpi__value small{font-family:var(--font-ui);font-size:15px;font-weight:600;color:var(--text-3);letter-spacing:0;margin-left:5px}
.kpi__value .pre{margin:0 5px 0 0}
.kpi__foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3);margin-top:8px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:var(--r-chip);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.delta--up{background:var(--success-soft);color:var(--success)}
.delta--down{background:var(--danger-soft);color:var(--danger)}
.spark{display:block;width:100%;height:34px;margin-top:4px;overflow:visible}
.spark path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.spark__line{stroke:var(--chart-1);stroke-width:1.8}
.spark__glow{stroke:var(--spark-trail);stroke-width:2.2;opacity:var(--spark-afterglow)}
.spark__trail{stroke:var(--spark-trail);opacity:0}
.spark__trail.t1{stroke-width:1.6}
.spark__trail.t2{stroke-width:2.2}
.spark__trail.t3{stroke-width:2.8}
.spark__head{fill:var(--spark-head);opacity:0;filter:drop-shadow(0 0 3px var(--spark-trail)) drop-shadow(0 0 7px var(--spark-trail))}
.spark.is-pending .spark__line,.spark.is-pending .spark__glow{opacity:0}
.spark.is-running .spark__trail.t1{opacity:.22}
.spark.is-running .spark__trail.t2{opacity:.5}
.spark.is-running .spark__trail.t3{opacity:.95}
.spark.is-running .spark__head{opacity:1}
.spark.is-done .spark__trail,.spark.is-done .spark__head{opacity:0;transition:opacity .45s ease}
.spark.is-done .spark__glow{opacity:0;transition:opacity var(--spark-cool) ease}
@media (max-width:1050px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------------------------------------------------------------- charts */
.chart{position:relative;height:var(--chart-h)}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .axis{font-family:var(--font-ui);font-size:11px;fill:var(--chart-axis)}
.chart .gridline{stroke:var(--chart-grid);stroke-width:1}
.chart .series{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chart .series--dash{stroke-width:1.6;stroke-dasharray:4 5}
.chart .reveal{animation:chartIn var(--dur-chart) var(--ease) both}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:barIn calc(var(--dur-chart) * 1.2) var(--ease-spring) both}
.chart .bar:hover{opacity:.82}
.chart .hit{fill:transparent}
.chart .cross{stroke:var(--text-3);stroke-dasharray:3 3;opacity:0;transition:opacity var(--dur-fast)}
.chart .dot{opacity:0;transition:opacity var(--dur-fast)}
.chart.is-hover .cross,.chart.is-hover .dot{opacity:1}
@keyframes chartIn{from{opacity:0;transform:translateY(10px)}}
@keyframes barIn{from{transform:scaleY(0)}}
.chart-tip{position:absolute;z-index:5;pointer-events:none;padding:7px 10px;border-radius:var(--r-tip);background:var(--tip-bg);color:var(--tip-text);border:var(--bw) solid var(--border);
  box-shadow:var(--shadow-pop);font-size:12px;line-height:1.45;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity var(--dur-fast)}
.chart-tip.on{opacity:1}
.chart-tip b{font-weight:700}
.chart-tip span{color:var(--text-3)}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend i.dash{height:0;width:14px;border-radius:0;border-top:2px dashed}
.donut{display:grid;gap:20px;justify-items:center}
.donut__ring{position:relative;aspect-ratio:1/1;width:100%;max-width:184px}
.donut__ring svg{width:100%;height:100%;display:block;animation:donutIn var(--dur-chart) var(--ease) both}
.donut__ring .seg{fill:none;transform-box:view-box;transform-origin:50% 50%;transition:transform var(--dur) var(--ease-spring),opacity var(--dur-fast);cursor:pointer}
.donut__ring.is-hover .seg{opacity:.35}
.donut__ring.is-hover .seg.on{opacity:1;transform:scale(1.045)}
.donut__mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut__mid b{display:block;font-family:var(--font-num);font-size:23px;font-weight:var(--fw-num);letter-spacing:var(--ls-num);line-height:1.1}
.donut__mid small{display:block;font-size:11.5px;color:var(--text-3)}
.donut__list{display:grid;gap:4px;font-size:13px;min-width:0;width:100%}
.donut__list div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;padding:3px 6px;margin:0 -6px;border-radius:8px;transition:background var(--dur-fast)}
.donut__list div.on{background:var(--row-hover)}
.donut__list i{width:10px;height:10px;border-radius:3px}
.donut__list span{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut__list b{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600}
@keyframes donutIn{from{opacity:0;transform:rotate(-40deg) scale(.92)}}

/* ---------------------------------------------------------------- dropdown menu (computers; the iPhone keeps its native picker) */
.select.is-open{border-color:var(--focus)}
.menu{position:fixed;z-index:140;min-width:160px;overflow:auto;overscroll-behavior:contain;padding:6px;border-radius:var(--r-menu);background:var(--menu-bg);
  border:var(--bw) solid var(--border);box-shadow:var(--shadow-pop);-webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);
  transform-origin:50% 0;animation:menuIn var(--dur) var(--ease-spring) both;scrollbar-width:thin}
.menu.is-up{transform-origin:50% 100%;animation-name:menuInUp}
.menu.is-closing{animation:menuOut .15s var(--ease) forwards;pointer-events:none}
.menu__item{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:36px;padding:0 10px 0 12px;border-radius:var(--r-menu-item);
  font-size:14px;color:var(--text);text-align:left;white-space:nowrap;transition:background var(--dur-fast)}
.menu__item:hover,.menu__item:focus{background:var(--neutral-soft);outline:none}
.menu__item:focus-visible{box-shadow:inset 0 0 0 1.5px var(--focus)}
.menu__item i{display:flex;color:var(--accent);opacity:0}
.menu__item.is-selected{font-weight:600}
.menu__item.is-selected i{opacity:1}
.menu__item:disabled{color:var(--text-4);cursor:default;background:none}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes menuInUp{from{opacity:0;transform:translateY(6px) scale(.97)}}
@keyframes menuOut{to{opacity:0;transform:scale(.98)}}

/* ---------------------------------------------------------------- data table */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .search{flex:1 1 220px;max-width:360px}
.table-wrap{max-height:420px;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-inner);border:var(--bw) solid var(--table-border);background:var(--table-bg);overscroll-behavior:contain}
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.table th{position:sticky;top:0;z-index:2;background:var(--table-head-bg);text-align:left;padding:0;border-bottom:var(--bw) solid var(--border-strong);white-space:nowrap;
  -webkit-backdrop-filter:var(--header-blur);backdrop-filter:var(--header-blur)}
.th-sort{display:flex;align-items:center;gap:6px;width:100%;padding:11px 14px;color:var(--th-text);font-size:var(--th-size);font-weight:var(--th-weight);letter-spacing:var(--th-spacing);text-transform:var(--th-case)}
.th-sort:hover{color:var(--text)}
.th-sort svg{opacity:.3;transition:transform var(--dur) var(--ease-spring),opacity var(--dur-fast)}
th[aria-sort] .th-sort{color:var(--text)}
th[aria-sort] .th-sort svg{opacity:1;color:var(--accent)}
th[aria-sort=descending] .th-sort svg{transform:rotate(180deg)}
th.num .th-sort{justify-content:flex-end}
.table td{padding:11px 14px;border-bottom:var(--bw) solid var(--hairline);white-space:nowrap}
.table td.wrap-ok{white-space:normal;min-width:180px}
.table tbody tr{transition:background var(--dur-fast)}
.table tbody tr:hover{background:var(--row-hover)}
.table tbody tr:last-child td{border-bottom:0}
.table td.num,.table th.num{text-align:right}
.table td.num{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600}
.table tr.is-new{animation:rowNew 1.4s var(--ease)}
@keyframes rowNew{0%{background:var(--accent-soft)}100%{background:transparent}}
.table-foot{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:12.5px;color:var(--text-3)}

/* ---------------------------------------------------------------- collapsible groups */
.groups{display:grid;gap:var(--group-gap)}
.group{background:var(--group-bg);border:var(--bw) solid var(--border);border-radius:var(--r-group);overflow:hidden;box-shadow:var(--shadow-group);
  -webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop)}
.group__head{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;text-align:left;transition:background var(--dur-fast)}
.group__head:hover{background:var(--row-hover)}
.chev{width:8px;height:8px;flex:none;border-right:1.7px solid var(--text-3);border-bottom:1.7px solid var(--text-3);transform:rotate(-45deg);transition:transform var(--dur-slow) var(--ease-spring)}
.group.is-open .chev{transform:rotate(45deg)}
.group__title{font-weight:var(--fw-strong);font-size:15px;flex:1;min-width:0}
.group__meta{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.group__sum{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;min-width:86px;text-align:right}
.group__body{display:none;border-top:var(--bw) solid var(--hairline)}
.group.is-open .group__body{display:block}
.group.is-open .group__body > *{animation:groupIn var(--dur-slow) var(--ease) both}
.group.is-open .group__body > :nth-child(2){animation-delay:30ms}
.group.is-open .group__body > :nth-child(3){animation-delay:60ms}
.group.is-open .group__body > :nth-child(4){animation-delay:90ms}
.group__row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 18px 11px 40px;font-size:13.5px}
.group__row + .group__row{border-top:var(--bw) solid var(--hairline)}

.mut{color:var(--text-3)}
.ambient{transition:opacity 1.2s ease}

/* ---------------------------------------------------------------- start */
.start{position:relative;z-index:1;min-height:100vh;display:none;align-items:center;justify-content:center;padding:calc(40px + var(--sat)) 20px calc(40px + var(--sab))}
.start.on{display:flex}
.startkarte{width:100%;max-width:480px}
.marke{display:flex;flex-direction:column;align-items:flex-start;gap:18px;margin-bottom:30px}
.marke .app-icon{width:88px;height:88px;border-radius:calc(var(--r-icon) * 2.3)}
.startkarte h1{font-family:var(--font-display);font-weight:var(--fw-display);font-size:42px;letter-spacing:var(--ls-display);margin:0;line-height:1}
.startkarte .lead{color:var(--text-2);margin:10px 0 0;font-size:15px;max-width:40ch}
.wahl{display:grid;gap:10px}
.wahl button{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px;border-radius:calc(var(--r-card) * .8);background:var(--surface);border:var(--bw) solid var(--border);
  box-shadow:var(--shadow-card);-webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);transition:transform var(--dur) var(--ease-spring),border-color var(--dur-fast)}
.wahl button:hover{border-color:var(--border-strong)}
.wahl button:active{transform:scale(var(--press))}
.wahl b{display:block;font-size:15.5px;font-weight:600}
.wahl small{display:block;font-size:13px;color:var(--text-3);margin-top:1px}
.wahl .ic{flex:none;width:38px;height:38px;border-radius:var(--r-control);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.wahl button.draft{border-color:var(--warning)}
.wahl button.draft .ic{background:var(--pr-soft);color:var(--pr-ink)}
.startfuss{margin-top:22px;font-size:13px;color:var(--text-3);line-height:1.6}
.startlook{margin-top:18px;max-width:300px}
.startlook .row-label{display:block;margin-bottom:8px}
.start.over .startkarte{outline:2px dashed var(--border-strong);outline-offset:18px;border-radius:var(--r-card)}

/* ---------------------------------------------------------------- page head: title + this week on the left, period + look on the right */
.kopf{display:flex;align-items:flex-start;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;padding:22px 0 18px}
.kopf__l{min-width:0}
.kopf h1{font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-h2);letter-spacing:var(--ls-display);line-height:var(--lh-display);margin:0}
.kopf__r{display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin-left:auto}
.ctl{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.kopf__look{display:flex;justify-content:flex-end}
.woche{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--text-3)}
.woche .wk{display:inline-flex;align-items:baseline;gap:7px}
.woche .wk b{font-family:var(--font-num);font-size:15px;font-weight:var(--fw-num);color:var(--text);font-variant-numeric:tabular-nums}
.woche .wk b.hit{color:var(--week-hit)}
.woche .wk b span{font-size:12px;color:var(--text-3);font-weight:600}
.woche .pips{display:flex;gap:4px;width:84px}
.woche .pips i{flex:1;height:5px;border-radius:3px;background:var(--week-none);transition:background .3s}
.woche .pips i.on{background:var(--gym)}
.woche .gew{display:inline-flex;gap:6px}
.woche .gew b{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}

/* pages */
.page{display:none}
.page.on{display:block;animation:auf .32s var(--ease)}
@keyframes auf{from{opacity:0;transform:translateY(6px)}}
@keyframes hoch{from{opacity:0;transform:translateY(8px)}}
.blatt{margin-bottom:var(--gap);padding:var(--pad-card)}
.blatt h2{font-family:var(--font-card-title);font-size:var(--fs-card-title);font-weight:var(--fw-card-title);letter-spacing:var(--ls-card-title);margin:0;line-height:1.25}
.bk{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.bk small{color:var(--text-3);font-size:12.5px}
.zwei{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);margin-bottom:var(--gap)}
.zwei>.blatt{margin-bottom:0}
.leer{color:var(--text-3);font-size:13px;padding:22px 0;text-align:center}
.hinweis{color:var(--text-2);font-size:13px;line-height:1.55;max-width:74ch}

/* buttons the tool draws: the shared .btn plus its own small toggles */
.kbtn{gap:7px}
.kbtn.on{background:var(--chip-on-bg);color:var(--chip-on-text);border-color:transparent}
.btn.log{min-height:44px}
.eingabe{width:100%;min-height:var(--field-h);padding:9px 14px;border-radius:var(--r-control);border:var(--bw) solid var(--field-border);background:var(--field-bg);color:var(--text);font-size:15px;
  outline:none;box-shadow:var(--field-shadow);transition:border-color var(--dur-fast),background var(--dur-fast),box-shadow var(--dur-fast)}
.eingabe::placeholder{color:var(--text-4)}
.eingabe:hover{border-color:var(--field-border-hover)}
.eingabe:focus{border-color:var(--focus);background:var(--field-bg-focus);box-shadow:0 0 0 3px var(--focus-ring)}
textarea.eingabe{resize:none;line-height:1.5;overflow:hidden}
select.eingabe{padding-right:38px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.eingabe.is-open{border-color:var(--focus)}
.eingabe option,.eingabe optgroup{background:var(--surface-solid);color:var(--text)}
@media (pointer:coarse){ .eingabe{font-size:16px} }
.feld{display:flex;flex-direction:column;gap:7px;min-width:0}
.feld>span{font-size:var(--field-label-size);font-weight:var(--field-label-weight);color:var(--field-label);letter-spacing:var(--field-label-spacing);text-transform:var(--field-label-case);display:flex;justify-content:space-between;align-items:center;gap:8px}
.feld>span small{font-weight:500;color:var(--text-3);text-transform:none;letter-spacing:0}
.chip.split{color:var(--gym-text);background:var(--gym)}
.chip.kg{background:var(--neutral-soft);color:var(--text)}
.chip.sp{background:var(--pr-soft);color:var(--pr-ink);white-space:normal;height:auto;min-height:26px;padding:4px 10px}
.chip.pr{background:var(--pr);color:var(--pr-text)}
.chip.pr.rep{background:var(--pr-soft);color:var(--pr-ink);box-shadow:inset 0 0 0 1.5px var(--pr)}
.jtag .chip{height:auto;min-height:24px;padding:3px 9px;font-size:11.5px}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* ---------------------------------------------------------------- overview: the head tile */
/* key figures: the kit's KPI cards under the hero */
.kpis{margin-bottom:var(--gap)}
.delta--flat{background:var(--neutral-soft);color:var(--text-2)}
.kpi__value b{font-weight:inherit}
.held{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.periode{font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--eyebrow)}
.gross{font-family:var(--font-num);font-weight:var(--fw-num);font-size:64px;letter-spacing:var(--ls-kpi);line-height:1;margin:10px 0 0;font-variant-numeric:tabular-nums}
.gross small{font-family:var(--font-ui);font-size:17px;letter-spacing:0;font-weight:600;color:var(--text-3);margin-left:8px}
.streifen{height:3px;width:120px;border-radius:2px;background:linear-gradient(90deg,var(--week-some),var(--gym) 60%,var(--week-hit));margin:16px 0 0;transform-origin:left;animation:streifen .9s var(--ease) both .2s}
@keyframes streifen{from{transform:scaleX(0)}}
.ringbox{display:flex;align-items:center;gap:14px}
.ringbox .rt{text-align:right;font-size:12.5px;color:var(--text-3);line-height:1.35}
.ringbox .rt b{display:block;font-family:var(--font-num);font-size:24px;color:var(--text);letter-spacing:var(--ls-num);font-weight:var(--fw-num)}
.ring .rbg{fill:var(--neutral-soft)}
.ring .rcore{fill:var(--surface-solid)}
.ring .raxle{fill:none;stroke:var(--text-3)}
.ring .seg.hit{stroke:var(--week-hit)}
.ring .seg.some{stroke:var(--week-some)}
.ring .seg.none{stroke:var(--week-none)}
.ring.ein .seg{animation:ringEin .9s var(--ease) both}
@keyframes ringEin{from{opacity:0}}

/* the year in squares */
.rscroll{overflow-x:auto;padding:4px 3px 6px;margin:0 -3px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.jahr{display:grid;grid-template-rows:auto repeat(7,auto);grid-auto-flow:column;gap:3px;min-width:0}
.jahr .ml{font-size:11px;color:var(--text-3);font-weight:600;white-space:nowrap;min-width:0;overflow:visible;height:17px}
.jahr .tl{font-size:9.5px;color:var(--text-3);font-weight:600;display:flex;align-items:center}
.rz{aspect-ratio:1/1;border-radius:24%;background:var(--cell);position:relative;min-width:0;transition:transform var(--dur-fast) var(--ease-spring)}
.rz.aus{background:transparent}
.rz.frei{background:var(--cell-free)}
.rz.gym{background:var(--gym)}
.rz[data-iso]{cursor:pointer}
.rz.blass{opacity:.28}
.rz.heute::after{content:"";position:absolute;inset:-3px;border-radius:32%;border:2px solid var(--text)}
.rz.kgpunkt::before{content:"";position:absolute;right:17%;top:17%;width:24%;height:24%;border-radius:50%;background:var(--cell-dot)}
.rz.gym.kgpunkt::before{background:var(--cell-dot-gym)}
.rz[data-iso]:hover{transform:scale(1.25);z-index:2}
.jahr.ein .rz{animation:zelle .5s var(--ease) both;animation-delay:calc(var(--c) * 9ms)}
@keyframes zelle{from{opacity:0;transform:scale(.4)}}
.jahr .rz.blass{animation-name:zelleBlass}
@keyframes zelleBlass{from{opacity:0;transform:scale(.4)}to{opacity:.28;transform:none}}

/* charts */
.chart{position:relative;height:auto}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-size:11px;fill:var(--chart-axis);font-family:var(--font-ui)}
.gitter{stroke:var(--chart-grid)}
.linie{fill:none;stroke:var(--weight);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart.ein .linie{animation:zeichnen 1.1s var(--ease) both}
@keyframes zeichnen{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.flaeche{fill:url(#gewVerlauf)}
.chart.ein .flaeche{animation:einb .9s .35s ease-out both}
@keyframes einb{from{opacity:0}}
.wpunkt{fill:var(--surface-solid);stroke:var(--weight);stroke-width:2}
.wdot{fill:var(--weight);stroke:var(--surface-solid);stroke-width:2.4}
.kreuz{stroke:var(--text-3)}
.saeule{transform-box:fill-box;transform-origin:bottom}
.saeule.hit{fill:var(--gym)}
.saeule.some{fill:var(--week-some)}
.saeule.none{fill:var(--week-none)}
.ziel{stroke:var(--text-2);stroke-opacity:.5}
.chart.ein .saeule{animation:wachsen .55s var(--ease-spring) both;animation-delay:calc(var(--i) * 14ms)}
@keyframes wachsen{from{transform:scaleY(0)}}
.tip{position:fixed;pointer-events:none;z-index:90;background:var(--tip-bg);color:var(--tip-text);font-size:12px;line-height:1.5;padding:7px 10px;border-radius:var(--r-tip);border:var(--bw) solid var(--border);
  box-shadow:var(--shadow-pop);white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 10px));transition:opacity .1s}
.tip.on{opacity:1}
.tip .t2{color:var(--text-3)}
.balken{display:flex;flex-direction:column;gap:10px}
.bz{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;align-items:center;gap:12px}
.bz .n{font-size:13px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.bz .spur{height:8px;background:var(--neutral-soft);border-radius:4px;overflow:hidden}
.bz .fuell{height:100%;border-radius:4px;transform-origin:left;background:linear-gradient(90deg,var(--week-some),var(--gym))}
.balken.ein .fuell{animation:quer .7s var(--ease) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes quer{from{transform:scaleX(0)}}
.bz .c{font-family:var(--font-num);font-weight:var(--fw-num);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.warn{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;padding:9px 12px;background:var(--pr-soft);border-radius:var(--r-control);font-size:12.5px;color:var(--pr-ink)}

/* ---------------------------------------------------------------- PRs */
.przeile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border-top:var(--bw) solid var(--hairline);padding:10px 4px;color:var(--text);
  border-radius:var(--r-control);transition:background var(--dur-fast)}
.przeile:first-child{border-top:0}
.przeile:hover{background:var(--row-hover)}
.przeile .mut{font-size:12.5px;white-space:nowrap}
.prtitel{font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--text-3);margin:18px 0 4px}
@media (max-width:520px){.przeile{grid-template-columns:auto minmax(0,1fr)}.przeile .mut{grid-column:2;white-space:normal}}

/* ---------------------------------------------------------------- data entry */
.eintrag{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:var(--gap);align-items:start}
.tagkopf{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.tagkopf .titel{flex:1;min-width:0}
.tagkopf .titel b{display:block;font-family:var(--font-display);font-weight:var(--fw-display);font-size:26px;letter-spacing:var(--ls-display);line-height:1.1}
.tagkopf .titel span{font-size:13px;color:var(--text-3)}
.rund{width:38px;height:38px;border-radius:50%;background:var(--neutral-soft);display:grid;place-items:center;color:var(--text-2);flex:none;transition:transform var(--dur) var(--ease-spring),color var(--dur-fast)}
.rund:hover{color:var(--text)}
.rund:active{transform:scale(.9)}
.heute-btn{background:var(--neutral-soft);color:var(--text);font-weight:600;font-size:12.5px;border-radius:var(--r-chip);padding:7px 12px;transition:transform var(--dur) var(--ease-spring)}
.heute-btn:active{transform:scale(var(--press))}
.tagwahl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:22px;padding:4px;background:var(--seg-bg);border:var(--bw) solid var(--border);border-radius:calc(var(--r-control) + 4px)}
.tagwahl button{border-radius:var(--r-control);padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--text-2);transition:background var(--dur-fast),color var(--dur-fast),box-shadow var(--dur-fast)}
.tagwahl button small{font-size:11px;color:var(--text-3);font-weight:600}
.tagwahl button b{font-family:var(--font-num);font-size:16px;font-weight:var(--fw-num);color:var(--text)}
.tagwahl button i{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:3px}
.tagwahl button i.gym{background:var(--gym)}
.tagwahl button i.da{background:var(--text-4)}
.tagwahl button:hover{background:var(--row-hover)}
.tagwahl button.on{background:var(--seg-active-bg);box-shadow:var(--seg-active-shadow)}
.tagwahl button.on b,.tagwahl button.on small{color:var(--seg-active-text)}
.tagwahl button.heute b{color:var(--accent)}
.tagwahl button.on.heute b{color:var(--seg-active-text)}
.form{display:grid;gap:18px}
.form .reihe{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px}
.kgfeld{position:relative}
.kgfeld input{padding-right:40px}
.kgfeld em{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--text-3);font-size:13px;pointer-events:none}
.eingabe.zahl{text-align:right}
.extras{display:flex;gap:8px;flex-wrap:wrap}
.prknopf{margin-left:auto;border:var(--bw) solid var(--pr);background:var(--pr-soft);color:var(--pr-ink);border-radius:var(--r-chip);padding:2px 10px;font-size:12px;font-weight:700;text-transform:none;letter-spacing:0}
.prknopf[aria-expanded="true"]{background:var(--pr);color:var(--pr-text)}
.prreihe{display:grid;grid-template-columns:minmax(0,1fr) 110px 96px auto;gap:8px;align-items:center}
@media (max-width:420px){.prreihe{grid-template-columns:minmax(0,1fr) 90px 80px}.prreihe .btn{grid-column:1/-1}}
.prreihe[hidden]{display:none}
.kalkopf{display:flex;align-items:center;gap:10px}
.kalzu .bk{margin-bottom:0}
.pille{display:inline-flex;align-items:center;gap:8px;border:var(--bw) solid var(--field-border);background:var(--field-bg);border-radius:var(--r-chip);padding:7px 14px 7px 10px;font-weight:600;font-size:13.5px;color:var(--text-2);
  transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast),transform var(--dur) var(--ease-spring)}
.pille:active{transform:scale(var(--press))}
.pille i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;transition:background var(--dur-fast),border-color var(--dur-fast)}
.pille i::after{content:"";width:4px;height:8px;border:solid var(--check-mark);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform var(--dur) var(--ease-spring)}
.pille.on{background:var(--gym-soft);border-color:var(--gym-line);color:var(--text)}
.pille.on i{background:var(--switch-on);border-color:var(--switch-on)}
.pille.on i::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
.wliste{display:flex;flex-direction:column}
.wtag{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;margin:0 -8px;border-radius:var(--r-control);text-align:left;width:calc(100% + 16px);transition:background var(--dur-fast)}
.wtag:hover,.wtag.on{background:var(--row-hover)}
.wtag .d{font-size:11px;color:var(--text-3);font-weight:600;line-height:1.2}
.wtag .d b{display:block;font-family:var(--font-num);font-size:17px;color:var(--text);font-weight:var(--fw-num)}
.wtag .d.we b{color:var(--accent)}
.wtag .t{min-width:0;font-size:13px;color:var(--text-2)}
.wtag .t .zeile1{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--text)}
.wtag .t .zeile1.rest{color:var(--text-3);font-weight:500}
.wtag .t .zeile2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-3);font-size:12px;margin-top:1px}
.wtag .kg{font-family:var(--font-num);font-weight:var(--fw-num);font-size:13px;color:var(--text-2);white-space:nowrap}
.wsum{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wsum .pips{display:flex;gap:4px;flex:1}
.wsum .pips i{flex:1;height:6px;border-radius:3px;background:var(--week-none)}
.wsum .pips i.on{background:var(--gym)}
.wsum b{font-family:var(--font-num);font-size:15px;font-weight:var(--fw-num)}

/* the month calendar on the overview */
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kal .kh{font-size:11.5px;font-weight:600;color:var(--text-3);padding:0 4px 2px}
.kt{min-height:122px;border-radius:var(--r-control);background:var(--field-bg);border:var(--bw) solid var(--border);padding:8px 9px 9px;display:flex;flex-direction:column;gap:5px;min-width:0;
  text-align:left;cursor:pointer;transition:border-color var(--dur-fast),transform var(--dur) var(--ease-spring);position:relative;overflow:hidden;color:var(--text)}
.kt:hover{border-color:var(--gym-line);transform:translateY(-2px)}
.kt:active{transform:scale(.97)}
.kt.leer0{background:transparent;border:var(--bw) dashed var(--border)}
.kt.leer0:hover{transform:none}
.kt.aus{visibility:hidden}
.kt.gym{background:linear-gradient(180deg,var(--gym-soft),transparent 75%),var(--field-bg);border-color:var(--gym-line)}
.kt.heute{box-shadow:0 0 0 2px var(--gym)}
.kt .kd{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.kt .kd b{font-family:var(--font-num);font-size:16px;font-weight:var(--fw-num)}
.kt.we .kd b{color:var(--accent)}
.kt .kd span{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.kt .kw{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:var(--r-chip);background:var(--gym);color:var(--gym-text);white-space:nowrap}

<script id="effects-glass">
(function(){
/* GLASS · signature-effects module. Optional: if it is missing or throws, the tool works the same.

window.THEME_FX = {
  effects: [
    { id: 'light', kind: 'signature', name: 'Drifting light', desc: 'One slow layer of blurred light moving under the glass. The only ambient element.' },
    { id: 'depth', kind: 'signature', name: 'Depth stack', desc: 'When a dialog or sheet opens, the page behind sinks back and dims; when it closes, the page floats forward again.' },
    { id: 'liquid', kind: 'signature', name: 'Liquid pill', desc: 'Tab pill and toggles stretch as they travel, then wobble into place like a drop of water.' },
    { id: 'float', kind: 'signature', name: 'Float', desc: 'Tiles lift towards you on hover, press in under your finger and spring back, and rise into place as you scroll.' },
    { id: 'frost', kind: 'signature', name: 'Frost glint', desc: 'The light on each KPI line sheds a little frost as it travels and lands with a glint. Now and then an end point twinkles.' },
    { id: 'tilt', kind: 'extra', name: 'Depth tilt', desc: 'KPI cards lean towards the pointer and the figure floats above the glass (desktop).' }
  ],

    for (const k in d.days){ const r = d.days[k]; if (r && r.kgSrc === 'text' && r.kg != null){ r.kg = null; r.kgSrc = null; KG_CLEANED++; } }

/* an alias points an old split name at the one you decided to keep */
function canon(label){
  let k = String(label || '').trim(); if (!k) return '';
  for (let i = 0; i < 8; i++){
    const a = C.aliases[k.toLowerCase()];
    if (!a || String(a).toLowerCase() === k.toLowerCase()) break;
    k = a;
  }
  return k;
}
function aliasesOf(name){ const out = [], lk = String(name).toLowerCase(); for (const k in C.aliases) if (String(C.aliases[k]).toLowerCase() === lk) out.push(k); return out.sort(); }
function partsOf(label){ const k = canon(label); if (!k) return null; for (const m in C.map) if (m.toLowerCase() === k.toLowerCase()) return C.map[m]; return null; }
function seenSplits(){ const o = {}; for (const k in DATA.days){ const t = (DATA.days[k].training || '').trim(); if (t) o[t] = (o[t] || 0) + 1; } return o; }
function mergeSplits(from, into){
  let n = 0; const lf = from.toLowerCase();
  for (const d in DATA.days) if (String(DATA.days[d].training || '').trim().toLowerCase() === lf){ DATA.days[d].training = into; n++; }
  const srcParts = C.map[from] || [];
  if (!C.map[into]) C.map[into] = [];
  if (!C.map[into].length && srcParts.length) C.map[into] = srcParts.slice();
  delete C.map[from];
  if (C.colors[from] && !C.colors[into]) C.colors[into] = C.colors[from];
  delete C.colors[from];
  for (const a in C.aliases) if (String(C.aliases[a]).toLowerCase() === lf) C.aliases[a] = into;
  C.aliases[lf] = into;
  delete C.aliases[String(into).toLowerCase()];
  return n;
}
function normKey(s){
  return String(s || '').toLowerCase().replace(/[()\[\]{}]/g, ' ').replace(/[&,\/]/g, '+').replace(/[^a-z0-9+ ]/g, ' ')
    .split('+').map(t => t.replace(/\s+/g, ' ').trim()).filter(Boolean).sort().join('+');
}
function mergeCandidates(){
  const seen = seenSplits(), names = {};
  for (const k in C.map) names[k] = seen[k] || 0;
  for (const s in seen) if (!(s in names)) names[s] = seen[s];
  const byKey = {};
  for (const nm in names){ const kk = normKey(nm); if (kk) (byKey[kk] = byKey[kk] || []).push({ name: nm, n: names[nm] }); }
  const out = [];
  for (const g in byKey) if (byKey[g].length > 1){ byKey[g].sort((a, b) => b.n - a.n || (a.name < b.name ? -1 : 1)); out.push(byKey[g]); }
  return out.sort((a, b) => a[0].name.toLowerCase() < b[0].name.toLowerCase() ? -1 : 1);
}

function yearsWithData(){ const s = {}; for (const k in DATA.days) s[k.slice(0, 4)] = 1; s[TODAY.slice(0, 4)] = 1; return Object.keys(s).sort(); }
function lastDataDay(year){ let best = null; for (const k in DATA.days) if (k.slice(0, 4) === year && (!best || k > best)) best = k; return best; }

/* scope = what the period controls point at */
function scope(){
  const y = parseInt(S.year, 10);
  const from = S.mode === 'ytd' ? new Date(Date.UTC(y, 0, 1)) : new Date(Date.UTC(y, S.month, 1));
  const to = new Date(Date.UTC(y, S.month + 1, 0));

}
function scopeOf(year, m0, m1){ return { from: new Date(Date.UTC(+year, m0, 1)), to: new Date(Date.UTC(+year, m1 + 1, 0)) }; }
function daysIn(sc){
  const a = ISO(sc.from), b = ISO(sc.to), out = [];
  for (const k in DATA.days) if (k >= a && k <= b) out.push([k, DATA.days[k]]);
  return out.sort((x, y) => x[0] < y[0] ? -1 : 1);
}

  return (long ? MONTHS[S.month] : MSHORT[S.month]) + ' ' + y;

/* the aggregate everything on the overview and in the PDF reads from */
function agg(sc){
  const d = daysIn(sc), a = { gym: 0, cardio: 0, stretch: 0, special: 0, journal: 0, logged: d.length, weights: [], split: {}, part: {}, unmapped: {},
    week: {}, dow: [0,0,0,0,0,0,0], month: {}, sessions: [], notes: [], days: d, sc: sc };
  d.forEach(([iso, v]) => {
    if (v.gym){
      a.gym++;
      const wk = ISO(monday(P(iso))); a.week[wk] = (a.week[wk] || 0) + 1;
      a.dow[dow(P(iso))]++;
      a.month[iso.slice(0, 7)] = (a.month[iso.slice(0, 7)] || 0) + 1;
      const lab = (v.training || '').trim();
      a.sessions.push({ iso, label: lab, kg: v.kg });
      if (lab){
        a.split[lab] = (a.split[lab] || 0) + 1;
        const ps = partsOf(lab);
        if (ps && ps.length) ps.forEach(x => { a.part[x] = (a.part[x] || 0) + 1; });
        else a.unmapped[lab] = (a.unmapped[lab] || 0) + 1;
      }
    }
    if (v.special){ a.special++; a.notes.push({ iso, txt: v.special }); }
    if (v.cardio) a.cardio++;
    if (v.stretch) a.stretch++;
    if (v.journal) a.journal++;
    if (v.kg !== null && v.kg !== undefined && v.kg !== '') a.weights.push({ iso, kg: Number(v.kg), src: v.kgSrc });
  });
  const last = d.length ? d[d.length - 1][0] : null;
  const fromIso = ISO(sc.from), toIso = ISO(sc.to);
  const end = last ? P(last) : (toIso > TODAY && fromIso <= TODAY ? P(TODAY) : sc.to);
  a.lastDay = last;
  a.spanDays = Math.max(1, Math.round((end - sc.from) / DAY) + 1);
  const cols = [];
  for (let w = monday(sc.from); w <= monday(end); w = add(w, 7)) cols.push({ iso: ISO(w), d: w, v: a.week[ISO(w)] || 0 });
  a.weeks = cols;
  a.hit = cols.filter(c => c.v >= C.weeklyTarget).length;
  a.perWeek = a.gym / a.spanDays * 7;
  return a;
}

/* Reads a picked file: the .json data file, or the old Trainingslog HTML with the data inside it. */
function lesen(text, name){

  if (t.charAt(0) === '{'){

    if (!o.days) throw new Error('This JSON has no training days in it.');

  if (/<html/i.test(t)){
    const doc = new DOMParser().parseFromString(t, 'text/html');

    if (p){ let o; try { o = JSON.parse(p.textContent); } catch (e){ throw new Error('The log inside this HTML could not be read.'); } return { data: normalize(o), from: 'html' }; }
    if (doc.getElementById('appdata')) throw new Error('That is the training plan, not the log. Open the log or its data file.');
    throw new Error('No training log data found in this HTML.');
  }

/* One way out for every file this tool writes: the save dialog where the browser has one (you choose folder and name),
   the share sheet on iPhone (Save to Files), a plain download as the last resort. */
async function ablegen(blob, name, art){
  if (window.showSaveFilePicker && !TOUCH){
    try {
      const opts = { suggestedName: name, types: [{ description: art.desc, accept: { [art.mime]: [art.ext] } }] };
      if (FILE.folder) opts.startIn = FILE.folder; else opts.id = 'trainingslog';
      let hd;
      try { hd = await window.showSaveFilePicker(opts); }
      catch (e){ if (e && e.name === 'AbortError') throw e; delete opts.startIn; opts.id = 'trainingslog'; hd = await window.showSaveFilePicker(opts); }
      const w = await hd.createWritable(); await w.write(blob); await w.close();
      return { ok: true, name: hd.name, handle: hd };
    } catch (e){
      if (e && e.name === 'AbortError') return { ok: false, abort: true };
      if (!(e && (e.name === 'SecurityError' || e.name === 'TypeError' || e.name === 'NotAllowedError'))) return { ok: false, err: e };
    }
  }
  if (TOUCH && navigator.canShare){
    try {
      const f = new File([blob], name, { type: art.mime });
      if (navigator.canShare({ files: [f] })){ await navigator.share({ files: [f] }); return { ok: true, name, shared: true }; }
    } catch (e){ if (e && e.name === 'AbortError') return { ok: false, abort: true }; }
  }
  const u = URL.createObjectURL(blob);
  /* phones that cannot share: show the PDF in a new tab, saving works from there */
  if (TOUCH && art.ext === '.pdf'){ const w = window.open(u, '_blank'); if (w){ setTimeout(() => URL.revokeObjectURL(u), 60000); return { ok: true, name, opened: true }; } }
  const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 800);
  return { ok: true, name, download: true };
}

/* the mark: an engraved ring with a dumbbell, the same family as the booking seal */
function rosette(cx, cy, rho, amp, k, ph){
  let d = '';
  for (let i = 0; i <= 240; i++){ const a = i / 240 * Math.PI * 2, r = rho + amp * Math.sin(k * a + ph); d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(2) + ',' + (cy + r * Math.sin(a)).toFixed(2); }
  return d + 'Z';
}
function hantelPfade(cx, cy, s, farbe, bar){
  const r = (x, y, w, hh, rx, f) => '<rect x="' + (cx + x * s) + '" y="' + (cy + y * s) + '" width="' + w * s + '" height="' + hh * s + '" rx="' + rx * s + '" fill="' + f + '"/>';
  return r(-22, -2.2, 44, 4.4, 2, bar || farbe) + r(-26, -13, 7, 26, 2.4, farbe) + r(19, -13, 7, 26, 2.4, farbe) + r(-32, -9, 5.5, 18, 2.2, farbe) + r(26.5, -9, 5.5, 18, 2.2, farbe) +
    r(-35, -2.6, 3.2, 5.2, 1.2, farbe) + r(31.8, -2.6, 3.2, 5.2, 1.2, farbe);
}

/* count-up for the large figures */
function hochzaehlen(el, ziel, dez, fmt){
  if (!el) return;
  fmt = fmt || (v => dez ? v.toFixed(dez) : String(Math.round(v)));
  const fertig = () => el.dispatchEvent(new CustomEvent('dl:number', { bubbles: true }));
  if (BEWEGUNG && isFinite(ziel) && Kit.numberReveal(el, 0, ziel, fmt, fertig)) return;
  if (!BEWEGUNG || !isFinite(ziel) || Math.abs(ziel) < 1){ el.textContent = fmt(ziel); return; }
  const t0 = performance.now(), dauer = 700;
  el.textContent = fmt(0);
  const schritt = t => { const x = Math.min(1, (t - t0) / dauer), e = 1 - Math.pow(1 - x, 3); el.textContent = fmt(ziel * e); if (x < 1) requestAnimationFrame(schritt); else { el.textContent = fmt(ziel); fertig(); } };
  requestAnimationFrame(schritt);
}

function vorperiode(){

  if (ytd) return { a: agg(scopeOf(y - 1, 0, S.month)), label: String(y - 1) };
  const m = S.month === 0 ? 11 : S.month - 1, yy = S.month === 0 ? y - 1 : y;
  return { a: agg(scopeOf(yy, m, m)), label: MSHORT[m] };
}
function kpiKarten(a, anim){

  const vp = vorperiode(), av = vp.a, vs = 'vs ' + vp.label, wv = av.weights;
  /* the lines: sessions per week; the gym rate as it built up (daily for a month, weekly for YTD); every weigh-in;
     the change as weekly averages against the first weigh-in */
  const proWoche = a.weeks.map(c => c.v);

/* ================================================================ personal records
   A lift record is a Special line like "Deadlift 210 kg" or, for a set, "Deadlift 190 kg x4".
   Only records with a body weight (that day, else the nearest within 7 days) take part.
   "PR "     heavier than every earlier record of that lift; on the same weight the lower body weight wins.
   "Rep-PR " not heavier, but more reps than every earlier record at that weight or heavier;
             on the same reps the lower body weight wins. A line without reps counts as 1 rep. */
const LIFTS = ['Bench', 'Squat', 'Deadlift', 'OHP'];
const PR_TAGE = 7;
const REKORD = /^((?:Rep-)?PR\s+)?([A-Za-zÀ-ſ][A-Za-zÀ-ſ \-]*?)\s+(\d+(?:[.,]\d+)?)\s*kg(?:\s*[x×]\s*(\d+))?\b(.*)$/;

function rekordVon(zeile){
  const m = REKORD.exec(String(zeile).trim());
  if (!m) return null;
  const art = m[1] ? (/^Rep/.test(m[1]) ? 'rep' : 'pr') : '';
  return { art, pr: !!art, lift: m[2].trim(), kg: parseFloat(m[3].replace(',', '.')), reps: m[4] ? parseInt(m[4], 10) : 1, rest: m[5] };
}
function rekordText(r, art){
  return (art === 'pr' ? 'PR ' : art === 'rep' ? 'Rep-PR ' : '') + r.lift + ' ' + String(Math.round(r.kg * 100) / 100) + ' kg' + (r.reps > 1 ? ' x' + r.reps : '') + (r.rest || '');
}
/* body weight for a day: its own, else the nearest logged one within PR_TAGE days */
function kgBei(iso, ausser){
  for (let d = 0; d <= PR_TAGE; d++) for (const s of [-1, 1]){
    if (!d && s > 0) continue;
    const q = ISO(add(P(iso), s * d)), r = DATA.days[q];
    if (q !== ausser && r && r.kg != null && r.kg !== '' && isFinite(r.kg)) return { kg: Number(r.kg), iso: q };
  }
  return null;
}
function liftsBekannt(){
  const o = {}; LIFTS.forEach(l => { o[l.toLowerCase()] = l; });
  for (const k in DATA.days) zeilenVon(DATA.days[k].special).forEach(z => { const r = rekordVon(z); if (r && !o[r.lift.toLowerCase()]) o[r.lift.toLowerCase()] = r.lift; });
  return Object.keys(o).map(k => o[k]);
}
/* the rule: r = { kg, reps, bw } against the earlier records of the same lift */
function prArt(r, frueher){
  let top = null;
  frueher.forEach(f => { if (!top || f.kg > top.kg || (f.kg === top.kg && f.bw < top.bw)) top = f; });
  if (!top || r.kg > top.kg || (r.kg === top.kg && r.bw < top.bw)) return { art: 'pr', ref: top };
  let rep = null;
  frueher.filter(f => f.kg >= r.kg).forEach(f => { if (!rep || f.reps > rep.reps || (f.reps === rep.reps && f.bw < rep.bw)) rep = f; });
  if (r.reps > 1 && (r.reps > rep.reps || (r.reps === rep.reps && r.bw < rep.bw))) return { art: 'rep', ref: rep };
  return { art: '', ref: top, rep };
}
/* every record of a lift before a day that has a body weight */
function rekordeVor(lift, iso){
  const out = [];
  Object.keys(DATA.days).filter(k => k < iso).sort().forEach(k => {
    zeilenVon(DATA.days[k].special).forEach(z => {
      const r = rekordVon(z); if (!r || r.lift.toLowerCase() !== lift.toLowerCase()) return;
      const b = kgBei(k); if (b) out.push({ kg: r.kg, reps: r.reps, bw: b.kg });
    });
  });
  return out;
}
/* judges a new record on a day, against the earlier days and the lines already in today's Special; bw is the weight on the form, if any */
function prUrteil(iso, lift, kg, reps, bw, heute){
  const b = bw ? { kg: bw, iso } : kgBei(iso, iso);
  if (!b) return { art: '', warum: 'no body weight within ' + PR_TAGE + ' days, so it is kept as a Special' };
  const frueher = rekordeVor(lift, iso);
  zeilenVon(heute).forEach(z => { const r = rekordVon(z); if (r && r.lift.toLowerCase() === lift.toLowerCase()) frueher.push({ kg: r.kg, reps: r.reps, bw: b.kg }); });
  const u = prArt({ kg, reps, bw: b.kg }, frueher), satz = f => f.kg + ' kg' + (f.reps > 1 ? ' x' + f.reps : '') + ' at ' + n1(f.bw) + ' kg';
  if (u.art === 'pr') return { art: 'pr', warum: 'PR!' + (u.ref ? ' Best was ' + satz(u.ref) : ' First record of this lift') };
  if (u.art === 'rep') return { art: 'rep', warum: 'Rep-PR! Best at this weight or heavier was ' + satz(u.ref) };

  let sx = W - MR;
  stats.slice().reverse().forEach(st => {
    font('bold', 12); const w1 = doc.getTextWidth(st[0]); font('normal', 6.5); const w2 = doc.getTextWidth(st[1]);
    const bw = Math.max(w1, w2);
    font('bold', 12); farbe(INK); text(st[0], sx, 22.5, { align: 'right' });
    font('normal', 6.5); farbe(INK3); text(st[1], sx, 26, { align: 'right' });
    sx -= bw + 9;
  });
  draw(RULE); doc.setLineWidth(.25); doc.line(ML, 30.5, W - MR, 30.5);

  /* calendar */
  const gut = 7, top = 34, unten = 196;
  const first = new Date(Date.UTC(+year, m, 1)), nDays = new Date(Date.UTC(+year, m + 1, 0)).getUTCDate(), off = dow(first);
  const rows = Math.ceil((off + nDays) / 7), cw = (CW - gut) / 7, kopfH = 5, ch = (unten - top - kopfH) / rows;
  DAYNAMES.forEach((dn, i) => { font('bold', 7.5); farbe(i > 4 ? BLAU2 : INK3); text(['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i], ML + gut + i * cw + 1.2, top + 3.2); });
  const y0 = top + kopfH;
  for (let r = 0; r < rows; r++){
    const wkStart = add(first, r * 7 - off);
    font('bold', 6.5); farbe(INK3); text('W' + isoWeek(wkStart), ML, y0 + r * ch + 4.2);
  }
  const SIZES = [7.2, 6.8, 6.4, 6, 5.6, 5.2, 4.8, 4.4];
  for (let i = 0; i < rows * 7; i++){
    const di = i - off + 1; if (di < 1 || di > nDays) continue;
    const x = ML + gut + (i % 7) * cw + .6, y = y0 + Math.floor(i / 7) * ch + .6, cww = cw - 1.2, chh = ch - 1.2;
    const iso = year + '-' + String(m + 1).padStart(2, '0') + '-' + String(di).padStart(2, '0'), r = DATA.days[iso], we = (i % 7) > 4;
    doc.setLineWidth(.25);
    if (r && r.gym){ fill(EIS); draw(EISRAND); doc.roundedRect(x, y, cww, chh, 1.8, 1.8, 'FD'); }
    else if (r){ fill([255, 255, 255]); draw(RULE); doc.roundedRect(x, y, cww, chh, 1.8, 1.8, 'FD'); }
    else { fill([250, 251, 250]); draw(rgb('#ECEFEC')); doc.roundedRect(x, y, cww, chh, 1.8, 1.8, 'FD'); }
    font('bold', 9.5); farbe(we ? BLAU2 : (r ? INK : INK3)); text(String(di), x + 2, y + 4.6);
    if (!r) continue;
    /* header line: date, then the workout right next to it, weight on the far right */
    let rechts = x + cww - 1.8;
    if (r.kg != null){ font('bold', 6.8); farbe(INK2); const kt = n2(r.kg) + ' kg'; text(kt, rechts, y + 4.4, { align: 'right' }); rechts -= doc.getTextWidth(kt) + 1.6; }
    font('bold', 9.5); let cx = x + 2 + doc.getTextWidth(String(di)) + 1.8;
    if (r.gym){
      font('bold', 6.6); const lab = kuerzen(r.training || 'Gym', Math.max(6, rechts - cx - 3.6)), tw = doc.getTextWidth(lab) + 3.6;
      fill(HELL); doc.roundedRect(cx, y + 1.65, tw, 3.9, 1.95, 1.95, 'F'); farbe(NAVY); text(lab, cx + 1.8, y + 4.45); cx += tw + 1.5;
    }
    let ty = y + 6.9;
    const ex = [r.cardio ? 'Cardio' : '', r.stretch ? 'Stretching' : ''].filter(Boolean).join(', ');
    if (ex){
      font('bold', 5.8); farbe(INK3);
      if (doc.getTextWidth(ex) <= rechts - cx) text(ex, cx, y + 4.4);
      else { text(kuerzen(ex, cww - 3.6), x + 1.8, ty + 2); ty += 3.2; }
    }
    /* Special and journal: largest size that fits */
    /* PR lines and the other Special lines can be switched on and off separately */
    const istPr = z => { const x = rekordVon(z); return !!(x && x.pr); };
    const sp = zeilenVon(r.special).filter(z => istPr(z) ? opt.prs : opt.notizen), jo = opt.journal ? zeilenVon(r.journal) : [];
    if (!sp.length && !jo.length) continue;
    const platz = y + chh - 1.6 - ty, breite = cww - 3.6;
    let wahl = null;
    for (const sz of SIZES){
      const lh = sz * 1.18 / K;
      font('bold', sz); const a1 = []; sp.forEach(t => doc.splitTextToSize(t, breite).forEach(z => a1.push({ z, pr: istPr(t) })));
      font('normal', sz); const a2 = []; jo.forEach(t => doc.splitTextToSize(t, breite - 1.6).forEach((z, k) => a2.push({ z, neu: k === 0 })));
      wahl = { sz, lh, a1, a2 };
      if ((a1.length + a2.length) * lh + .6 <= platz + lh * .3) break;
    }
    const maxZ = Math.max(1, Math.floor((platz + wahl.lh * .3) / wahl.lh));
    let n = 0;
    wahl.a1.forEach(e => { if (n >= maxZ) return; font('bold', wahl.sz); farbe(e.pr ? PRFARBE : BLAU); text(e.z, x + 1.8, ty + wahl.lh * .82); ty += wahl.lh; n++; });
    for (let k = 0; k < wahl.a2.length; k++){
      if (n >= maxZ) break;
      const e = wahl.a2[k], letzte = n === maxZ - 1 && k < wahl.a2.length - 1;
      font('normal', wahl.sz); farbe(INK2);
      if (e.neu){ fill(HELL); doc.circle(x + 2.3, ty + wahl.lh * .5, Math.max(.32, wahl.sz * .055), 'F'); }
      text(letzte ? kuerzen(e.z + ' ...', breite - 1.6) : e.z, x + 3.4, ty + wahl.lh * .82);
      ty += wahl.lh; n++;
    }
  }

  /* footer: weeks and body parts, squeezed into one line each */
  const wochen = a.weeks.map(c => 'W' + isoWeek(c.d) + ': ' + c.v).join('  \u00b7  ');
  const teile = ranked(a.part).map(p => p.k + ' ' + p.v).join('  \u00b7  ');
  font('bold', 6.5); farbe(INK2); text('Sessions per week', ML, 201); text('Body parts', ML, 205);
  font('normal', 6.5); farbe(INK3);
  text(kuerzen(wochen || '-', 150), ML + 22, 201); text(kuerzen(teile || '-', 160), ML + 22, 205);
  text((C.name ? C.name + '  /  ' : '') + 'RISE  /  exported ' + deDate(P(TODAY)), W - MR, 205, { align: 'right' });
  doc.setProperties({ title: 'Training report ' + monat, creator: 'RISE' });
  return doc;
}

  ],

  onTheme: (id, first) => { if (!first && DATA && $('#shell').classList.contains('on')){ S.firstPaint[S.tab] = true; try { render(); } catch (e){ console.error(e); } } },

});

   also opens without a signal. Opened as a local file, nothing of this is loaded. */

  document.head.appendChild(h('link', { rel: 'manifest', href: 'manifest.webmanifest' }));
  if ('serviceWorker' in navigator){
    const hatteSchon = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hatteSchon) toast('A new version is ready. Close and reopen the app to use it.'); });
  }
  /* asks the browser to keep this site's storage (the draft) rather than clear it when space runs low */
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
zeigeStart();
})();
